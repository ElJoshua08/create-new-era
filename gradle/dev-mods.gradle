def enabled = [
    client     : (findProperty('dev_client_mods') ?: 'true').toBoolean(),
    jei        : (findProperty('dev_jei') ?: 'true').toBoolean(),
    shaders    : (findProperty('dev_shaders') ?: 'true').toBoolean(),
    aeronautics: (findProperty('dev_aeronautics') ?: 'true').toBoolean(),
]

def clientDir = file('run')
def serverDir = file('run/server')

// plain closures (not script methods) so task actions can call them and the configuration cache can store them
def sha1Of = { File f ->
    def md = MessageDigest.getInstance('SHA-1')
    f.withInputStream { st -> byte[] buf = new byte[65536]; int n; while ((n = st.read(buf)) > 0) md.update(buf, 0, n) }
    md.digest().encodeHex().toString()
}.dehydrate()

def fetch = { String url, File target, String sha1 ->
    if (target.exists() && sha1Of(target) == sha1) return
    target.parentFile.mkdirs()
    def tmp = new File(target.path + '.part')
    new URL(url).withInputStream { input -> tmp.withOutputStream { it << input } }
    def actual = sha1Of(tmp)
    if (actual != sha1) {
        tmp.delete()
        throw new GradleException("Checksum mismatch for ${target.name}: expected ${sha1}, got ${actual}")
    }
    tmp.renameTo(target)
}.dehydrate()

def setupDevClient = tasks.register('setupDevClient') {
    group = 'mod development'
    description = 'Downloads the dev-only client mods, JEI, Aeronautics and shaderpacks into run/.'
    def files = devFiles.findAll { enabled[it[0]] }
    def wantShaders = enabled.shaders
    inputs.property('files', files.collect { it[2] })
    doLast {
        files.each { group, folder, name, url, sha1 -> fetch(url, new File(clientDir, "${folder}/${name}"), sha1) }
        // pick the shaderpack once; after that the in-game choice wins
        def iris = new File(clientDir, 'config/iris.properties')
        if (wantShaders && !iris.exists()) {
            iris.parentFile.mkdirs()
            iris.text = 'shaderPack=ComplementaryReimagined_r5.9.3.zip\nenableShaders=true\n'
        }
    }
}

def setupDevServer = tasks.register('setupDevServer') {
    group = 'mod development'
    description = 'Downloads Aeronautics into run/server/ for the dev server.'
    def files = devFiles.findAll { it[0] == 'aeronautics' && enabled.aeronautics }
    doLast {
        files.each { group, folder, name, url, sha1 -> fetch(url, new File(serverDir, "${folder}/${name}"), sha1) }
    }
}

tasks.matching { it.name == 'runClient' }.configureEach { dependsOn setupDevClient }

// straight into a world on launch: the save folder's name under run/saves
def devWorld = findProperty('dev_world')
if (devWorld && file("run/saves/${devWorld}").isDirectory())
    neoForge.runs.client.programArguments.addAll('--quickPlaySingleplayer', devWorld)
tasks.matching { it.name in ['runServer', 'runGameTestServer'] }.configureEach { dependsOn setupDevServer }
