name: create-new-era

# Landing page and docs (under /docs/) for create-new-era.tryberyl.dev. Beryl routes the domain to 127.0.0.1:8098.
services:
  web:
    build: { context: .., dockerfile: deploy/website.Dockerfile }
    restart: unless-stopped
    ports:
      - "127.0.0.1:8098:80"
    mem_limit: 64m
